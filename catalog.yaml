# Quizzman Classical Texts — catalog
# Source notes: thebronzemirror.com has curated passages (CC BY-SA 4.0 EN)
# Full Hán văn must come from PD/open sources (Wikisource, ctext, …).

spec: classical-text/v1
org: the-quizzman
parent_url: https://wiki.quizzman.com
bronzemirror:
  site: https://thebronzemirror.com/
  corpus: sources/bronzemirror-corpus.json
  license: "Original translations CC BY-SA 4.0; original Chinese texts public domain."

# Collections are index repos (no chapter files). Constituents are real book repos.
